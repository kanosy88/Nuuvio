# Nuuvio fork: manual upstream sync + release (see README-NUUVIO.md).
# Merges an upstream NuvioMedia/NuvioDesktop release tag into `perso` (merge, never rebase or force push),
# runs the Letterboxd/Journal tests, builds macOS (DMG), Windows (MSI) and Linux (DEB + AppImage),
# publishes a GitHub Release "nuuvio-<tag>-<run>" and only then moves `perso` to the merged commit.
name: Nuuvio sync and release

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Upstream tag to merge (empty = latest upstream release)
        required: false
        type: string
      macos_intel:
        description: Also build the macOS Intel (x86_64) DMG (+63 MB of Git LFS download)
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: nuuvio-release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: NuvioMedia/NuvioDesktop
  UPSTREAM_LFS_URL: https://github.com/NuvioMedia/NuvioDesktop.git/info/lfs
  BRANCH: perso

jobs:
  sync:
    name: Merge upstream tag into perso
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
      merged: ${{ steps.merge.outputs.merged }}
      temp_branch: ${{ steps.merge.outputs.temp_branch }}
      upstream_tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      # Never download Git LFS content here: the merge only needs the pointer files.
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - name: Check out perso
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Resolve upstream tag
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG// /}"
          if [[ -z "${tag}" ]]; then
            tag="$(gh api "repos/${UPSTREAM_REPO}/releases?per_page=30" --jq '[.[] | select(.draft | not)][0].tag_name')"
          fi
          if [[ ! "${tag}" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "::error::Invalid upstream tag '${tag}'."
            exit 1
          fi
          git fetch --no-tags "https://github.com/${UPSTREAM_REPO}.git" "+refs/tags/${tag}:refs/upstream-tags/${tag}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Upstream tag: ${tag}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Merge
        id: merge
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          target="refs/upstream-tags/${TAG}"

          if git merge-base --is-ancestor "${target}" HEAD; then
            echo "perso already contains ${TAG}: nothing to merge." | tee -a "${GITHUB_STEP_SUMMARY}"
            echo "merged=false" >> "${GITHUB_OUTPUT}"
            echo "temp_branch=" >> "${GITHUB_OUTPUT}"
            echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git merge --no-ff --no-commit "${target}" || true

          # Keep the fork's own .github/workflows: upstream workflows are disabled on the fork, and a
          # merge that changes workflow files could not be pushed with the workflow token.
          { git diff --name-only --cached HEAD -- .github/workflows; git diff --name-only --diff-filter=U -- .github/workflows; } \
            | sort -u | while IFS= read -r path; do
              [[ -z "${path}" ]] && continue
              if git cat-file -e "HEAD:${path}" 2>/dev/null; then
                git checkout HEAD -- "${path}"
              else
                git rm -q -f -- "${path}"
              fi
            done

          conflicts="$(git diff --name-only --diff-filter=U)"
          if [[ -n "${conflicts}" ]]; then
            git merge --abort
            echo "::error::Merge conflict with upstream ${TAG}:"
            printf '%s\n' "${conflicts}"
            body_file="$(mktemp)"
            {
              echo "Le merge automatique du tag upstream \`${TAG}\` dans \`perso\` a échoué (run ${SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID})."
              echo
              echo "Fichiers en conflit :"
              echo
              printf -- '- `%s`\n' ${conflicts}
              echo
              echo "Résolution locale :"
              echo
              echo '```sh'
              echo "git checkout perso && git pull origin perso"
              echo "git fetch upstream --tags"
              echo "git merge ${TAG}        # résoudre, puis git commit"
              echo "git push origin perso"
              echo "nuuvio-update            # relance le build"
              echo '```'
            } > "${body_file}"
            gh issue create --repo "${GITHUB_REPOSITORY}" \
              --title "[nuuvio-sync] Conflit de merge avec upstream ${TAG}" \
              --body-file "${body_file}" || echo "::warning::Could not open the conflict issue."
            exit 1
          fi

          git commit --no-edit -m "Merge upstream ${TAG} into perso"
          temp_branch="nuuvio-ci/run-${RUN_ID}"
          git push --no-verify origin "HEAD:refs/heads/${temp_branch}"
          echo "Merged ${TAG} into perso (pushed to ${temp_branch} until the release is published)." >> "${GITHUB_STEP_SUMMARY}"
          echo "merged=true" >> "${GITHUB_OUTPUT}"
          echo "temp_branch=${temp_branch}" >> "${GITHUB_OUTPUT}"
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Release metadata
        id: meta
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^VERSION_NAME=//p' composeApp/Configuration/DesktopVersion.properties | tr -d '[:space:]')"
          if [[ -z "${version}" ]]; then
            echo "::error::VERSION_NAME missing from composeApp/Configuration/DesktopVersion.properties"
            exit 1
          fi
          release_tag="nuuvio-${TAG}-${RUN_NUMBER}"
          if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::Release ${release_tag} already exists."
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"

  test:
    name: Letterboxd / Journal tests
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.sha }}

      - name: Install Linux build dependencies
        run: bash ./scripts/linux/install-desktop-build-dependencies.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Write local.properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${LOCAL_PROPERTIES_BASE64}" ]]; then echo "::error::Repository secret LOCAL_PROPERTIES_BASE64 is missing."; exit 1; fi
          printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties

      - name: Run tests
        run: |
          xvfb-run -a ./gradlew :composeApp:desktopTest \
            --tests 'com.nuvio.app.features.letterboxd.*' \
            --tests 'com.nuvio.app.features.journal.*' \
            --tests 'com.nuvio.app.core.storage.NuuvioDataDirsTest' \
            --no-configuration-cache --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nuuvio-test-reports
          path: composeApp/build/reports/tests/desktopTest
          retention-days: 7

  macos:
    name: macOS ${{ matrix.arch }}
    needs: sync
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.macos_intel && '["arm64","x86_64"]' || '["arm64"]') }}
    env:
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.sync.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.sha }}

      - name: Git LFS cache key
        id: lfs
        run: |
          set -euo pipefail
          files="$(git lfs ls-files -l -I "composeApp/src/desktopMain/native/macos/runtime/${ARCH}/**")"
          echo "key=lfs-macos-${ARCH}-$(printf '%s' "${files}" | shasum -a 256 | cut -c1-16)" >> "${GITHUB_OUTPUT}"

      - uses: actions/cache@v5
        with:
          path: .git/lfs/objects
          key: ${{ steps.lfs.outputs.key }}

      - name: Fetch macOS libmpv runtime (Git LFS, this architecture only)
        run: |
          set -euo pipefail
          include="composeApp/src/desktopMain/native/macos/runtime/${ARCH}/**"
          git lfs pull --include="${include}" --exclude="" \
            || git -c lfs.url="${UPSTREAM_LFS_URL}" lfs pull --include="${include}" --exclude=""
          file "composeApp/src/desktopMain/native/macos/runtime/${ARCH}/libmpv.2.dylib" | grep -q 'Mach-O' \
            || { echo "::error::libmpv was not materialized from Git LFS."; exit 1; }

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Write local.properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${LOCAL_PROPERTIES_BASE64}" ]]; then echo "::error::Repository secret LOCAL_PROPERTIES_BASE64 is missing."; exit 1; fi
          printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
          grep -Eq '^NUVIO_SUPABASE_URL=.+' local.properties || { echo "::error::NUVIO_SUPABASE_URL missing from the secret."; exit 1; }

      - name: Build unsigned DMG
        env:
          NUUVIO_BUILD_NUMBER: ${{ github.run_number }}
          NUVIO_MACOS_SIGNING_IDENTITY: ''
          NUVIO_MACOS_NOTARY_KEYCHAIN_PROFILE: ''
        run: |
          ./gradlew :composeApp:packageReleaseDmg \
            "-Pnuvio.macos.arch=${ARCH}" \
            -Pcompose.desktop.packaging.checkJdkVendor=false \
            --no-configuration-cache --no-daemon --stacktrace
          dmg="composeApp/build/compose/release-dmgs/Nuuvio-macOS-${ARCH}-${VERSION}.dmg"
          test -f "${dmg}" || { echo "::error::Expected DMG not produced: ${dmg}"; ls -la composeApp/build/compose/release-dmgs || true; exit 1; }
          ls -lh "${dmg}"

      - uses: actions/upload-artifact@v7
        with:
          name: nuuvio-macos-${{ matrix.arch }}
          path: composeApp/build/compose/release-dmgs/Nuuvio-macOS-${{ matrix.arch }}-${{ needs.sync.outputs.version }}.dmg
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64
    needs: sync
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      VERSION: ${{ needs.sync.outputs.version }}
      WEBVIEW2_VERSION: 1.0.4078.44
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.sha }}

      - name: Git LFS cache key
        id: lfs
        shell: bash
        run: |
          set -euo pipefail
          files="$(git lfs ls-files -l -I "composeApp/src/desktopMain/native/windows/runtime/**")"
          echo "key=lfs-windows-$(printf '%s' "${files}" | sha256sum | cut -c1-16)" >> "${GITHUB_OUTPUT}"

      - uses: actions/cache@v5
        with:
          path: .git/lfs/objects
          key: ${{ steps.lfs.outputs.key }}

      - name: Fetch Windows libmpv runtime (Git LFS)
        shell: bash
        run: |
          set -euo pipefail
          include="composeApp/src/desktopMain/native/windows/runtime/**"
          git lfs pull --include="${include}" --exclude="" \
            || git -c lfs.url="${UPSTREAM_LFS_URL}" lfs pull --include="${include}" --exclude=""
          runtime="composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll"
          size="$(wc -c < "${runtime}")"
          if (( size < 1000000 )); then echo "::error::libmpv-2.dll was not materialized from Git LFS."; exit 1; fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Write local.properties
        shell: bash
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${LOCAL_PROPERTIES_BASE64}" ]]; then echo "::error::Repository secret LOCAL_PROPERTIES_BASE64 is missing."; exit 1; fi
          printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 `
            -Version $env:WEBVIEW2_VERSION `
            -OutputDirectory "$env:RUNNER_TEMP\nuget" `
            -DirectDownload -NonInteractive -NoCache
          $webView2Root = Join-Path $env:RUNNER_TEMP "nuget\Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          if (-not (Test-Path (Join-Path $webView2Root "build\native\x64\WebView2Loader.dll.lib"))) {
            throw "WebView2Loader.dll.lib was not found under $webView2Root"
          }
          "WEBVIEW2_ROOT=$webView2Root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build MSI
        shell: pwsh
        env:
          NUUVIO_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          & .\gradlew.bat `
            :composeApp:packageReleaseMsi `
            "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" `
            "-Pcompose.desktop.packaging.checkJdkVendor=false" `
            --no-configuration-cache --no-daemon --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msi = "composeApp\build\compose\release-msis\Nuuvio-Windows-x64-$env:VERSION.msi"
          if (-not (Test-Path $msi)) { throw "Expected MSI not produced: $msi" }
          Get-Item $msi | Format-List Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: nuuvio-windows-x64
          path: composeApp/build/compose/release-msis/Nuuvio-Windows-x64-${{ needs.sync.outputs.version }}.msi
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux x64 (DEB + AppImage)
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.sync.outputs.version }}
      APPIMAGE_TOOL_VERSION: 1.9.1
      APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
    steps:
      # Linux links the system libmpv: no Git LFS download at all.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.sha }}

      - name: Install Linux build dependencies
        run: bash ./scripts/linux/install-desktop-build-dependencies.sh fakeroot

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Write local.properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${LOCAL_PROPERTIES_BASE64}" ]]; then echo "::error::Repository secret LOCAL_PROPERTIES_BASE64 is missing."; exit 1; fi
          printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties

      - name: Download appimagetool
        run: |
          set -euo pipefail
          tool="${RUNNER_TEMP}/appimagetool-x86_64.AppImage"
          curl -fsSL -o "${tool}" "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGE_TOOL_VERSION}/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  ${tool}" | sha256sum -c -
          chmod +x "${tool}"
          echo "APPIMAGETOOL=${tool}" >> "${GITHUB_ENV}"

      - name: Build DEB and AppImage
        env:
          NUUVIO_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          ./gradlew :composeApp:packageReleaseDeb :composeApp:packageReleaseAppImage \
            -Pcompose.desktop.packaging.checkJdkVendor=false \
            --no-configuration-cache --no-daemon --stacktrace
          mkdir -p dist
          mapfile -t debs < <(find composeApp/build/compose/binaries/main-release/deb -maxdepth 1 -name '*.deb' | sort)
          if [[ "${#debs[@]}" -ne 1 ]]; then echo "::error::Expected one .deb, found ${#debs[@]}"; exit 1; fi
          cp "${debs[0]}" "dist/Nuuvio-Linux-x86_64-${VERSION}.deb"
          appimage="composeApp/build/compose/release-appimages/Nuuvio-Linux-x86_64-${VERSION}.AppImage"
          test -f "${appimage}" || { echo "::error::Expected AppImage not produced: ${appimage}"; exit 1; }
          cp "${appimage}" dist/
          chmod +x dist/*.AppImage
          dpkg-deb -f "dist/Nuuvio-Linux-x86_64-${VERSION}.deb" Package Version
          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: nuuvio-linux-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release and push perso
    needs: [sync, test, macos, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.sync.outputs.sha }}
      MERGED: ${{ needs.sync.outputs.merged }}
      TEMP_BRANCH: ${{ needs.sync.outputs.temp_branch }}
      UPSTREAM_TAG: ${{ needs.sync.outputs.upstream_tag }}
      RELEASE_TAG: ${{ needs.sync.outputs.release_tag }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: nuuvio-*
          merge-multiple: true

      - name: Create GitHub release
        run: |
          set -euo pipefail
          ls -lh dist
          {
            echo "Nuuvio (fork personnel de Nuvio Desktop) basé sur le tag upstream \`${UPSTREAM_TAG}\`, build ${RUN_NUMBER}, commit \`${SHA}\`."
            echo
            if [[ "${MERGED}" == "true" ]]; then echo "Ce build a mergé \`${UPSTREAM_TAG}\` dans \`perso\`."; else echo "Aucun nouveau commit upstream à merger."; fi
            echo
            echo "- macOS : \`Nuuvio-macOS-<arch>-*.dmg\` (non signé : clic droit > Ouvrir, ou \`xattr -dr com.apple.quarantine /Applications/Nuuvio.app\`), ou \`nuuvio-update\`."
            echo "- Windows : \`Nuuvio-Windows-x64-*.msi\` (SmartScreen : Informations complémentaires > Exécuter quand même)."
            echo "- Linux : \`.deb\` ou \`.AppImage\`."
            echo
            echo "Voir README-NUUVIO.md."
          } > notes.md
          gh release create "${RELEASE_TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${SHA}" \
            --title "Nuuvio ${UPSTREAM_TAG} (build ${RUN_NUMBER})" \
            --notes-file notes.md \
            --latest
          echo "Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Push perso
        if: needs.sync.outputs.merged == 'true'
        run: |
          set -euo pipefail
          if ! gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" -f sha="${SHA}" -F force=false >/dev/null; then
            echo "::error::perso moved during the build: the release ${RELEASE_TAG} is published but perso was NOT updated. Merge the tag ${RELEASE_TAG} into perso by hand."
            exit 1
          fi
          echo "perso -> ${SHA}" >> "${GITHUB_STEP_SUMMARY}"
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${TEMP_BRANCH}" || true

  cleanup:
    name: Remove temporary branch
    needs: [sync, release]
    if: always() && needs.sync.outputs.temp_branch != '' && needs.release.result != 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TEMP_BRANCH: ${{ needs.sync.outputs.temp_branch }}
    steps:
      - run: gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${TEMP_BRANCH}" || true
